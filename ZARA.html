<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="viewport" content="width=990">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link rel="icon" href="country.png" sizes="192x192" type="image/png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#141a2e">
  <meta charset="UTF-8" />
  
  <title>ZARA bot</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="SEYRAN.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.11.0/math.min.js"></script>
  <style>
    #{bot_id} {
        background-image: url('country.png');
        background-size: cover;
    }
  </style>
</head>
<body>
<div id="imgViewer">
  <span id="closeViewer">✖</span>
  <img id="viewerImg" src="">
</div>
<header>ZARA AI - 3.0</header>
<div id="container">
  <div id="menu">
    <span id="newChat">New Chat</span>
    
    <div class="txt">
      <a href="/DORO.html">
        <button id="DORO" style="background-image: url('recipe.png'); background-size: cover;"></button>
      </a>
      <div id="txt">
        DORO<br />Recipes</div>
    </div>
    <div class="txt">
      <a href="/LUNA.html">
        <button id="LUNA" style="background-image: url('movie.png'); background-size: cover;"></button>
      </a>
      <div id="txt">
        LUNA<br />Movies</div>
    </div>
    <div class="txt">
      <a href="/index.html">
        <button id="SEYRAN" style="background-image: url('web.png'); background-size: cover;"></button>
      </a>
      <div id="txt">
        SEYRAN<br />Information</div>
    </div>
    <div class="txt">
      <a href="/LEO.html">
        <button id="LEO" style="background-image: url('song.png'); background-size: cover;"></button>
      </a>
      <div id="txt">
        LEO<br />Songs</div>
    </div>
    <div class="txt">
      <a href="/SAKI.html">
        <button id="SAKI" style="background-image: url('joke.png'); background-size: cover;"></button>
      </a>
      <div id="txt">
        SAKI<br />Jokes</div>
    </div>

    <div class="txt">
      <a href="/KIRA.html">
        <button id="KIRA" style="background-image: url('book.png'); background-size: cover;"></button>
      </a>
      <div id="txt">
        KIRA<br />Books</div>
    </div>
    <div class="txt">
      <a href="/MIRA.html">
        <button id="MIRA" style="background-image: url('weather.png'); background-size: cover;"></button>
      </a>
      <div id="txt">
        MIRA<br />Weather</div>
    </div>
    <div class="txt">
      <a href="/NOVA.html">
        <button id="NOVA" style="background-image: url('space.png'); background-size: cover;"></button>
      </a>
      <div id="txt">
        NOVA<br />Space</div>
    </div>
    <div class="txt">
      <a href="/VEGA.html">
        <button id="VEGA" style="background-image: url('games.png'); background-size: cover;"></button>
      </a>
      <div id="txt">
        VEGA<br />Games</div>
    </div>
    <div class="txt">
      <a href="/ALTA.html">
        <button id="ALTA" style="background-image: url('crypto.png'); background-size: cover;"></button>
      </a>
      <div id="txt">
        ALTA<br />Crypto</div>
    </div>
    <span type="button" id="lp" onclick="kml()">Hide Bots</span>
    <div id="library" class="hidden"></div>
  </div>
  <div id="chat-area">
    <div id="chat-box">
      <div class="bot">
      <p>Hello 🙂 I'm here to help you.</p>
      </div>
    </div>
    <div id="input-area">
      <textarea id="input"></textarea>
      <button id="voice" onclick="lll()">
        <i class="material-icons">mic</i>
      </button>
      <button id="send">
        <i class="material-icons">send</i>
      </button>
    </div>
    <button type="button" id="m" onclick="kl()">Switch AI</button>
  </div>
</div>
<script src="/expanded_apis.js"></script>
<script src="s.js"></script>
</body>
</html>
